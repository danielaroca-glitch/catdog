sonar.projectKey=catdog-danielaquiaro
sonar.projectName=catdog-danielaquiaro
sonar.exclusions=**/node_modules/**,**/*.spec.test.*,**/*.config.*,**/coverage/**
sonar.javascript.lcov.reportPaths=services/backend/coverage/lcov.info,services/frontend/coverage/lcov.info
# Sem isso, Sonar não sabe distinguir teste de produção quando ambos vivem na
# mesma árvore de pastas — testes viravam "código-fonte sem cobertura" e
# derrubavam a métrica de coverage do projeto inteiro.
sonar.tests=.
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx
# Wiring/composição (sem lógica de negócio) e primitivas geradas pelo shadcn —
# mesma exclusão já aplicada nas métricas locais de cobertura (Jest), ver
# .makuco/docs/codebase/testing.md.
sonar.coverage.exclusions=**/*.module.ts,**/main.ts,services/frontend/src/components/ui/**
